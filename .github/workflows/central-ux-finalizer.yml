name: Central UX finalizer

on:
  push:
    branches:
      - auditoria-codex-parcial

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'chore: apply Central UX finalizer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: auditoria-codex-parcial
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python scripts/central_ux_patch.py
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Check TypeScript
        run: npm run check
      - name: Build production application
        run: npm run build
      - name: Commit verified implementation
        run: |
          rm .github/workflows/central-ux-finalizer.yml scripts/central_ux_patch.py
          git config user.name "Sebastian Aguilat"
          git config user.email "116051904+sebastian3301283@users.noreply.github.com"
          git add -A
          git commit -m "feat: refine Central editing and guideline flow"
          git push origin HEAD:auditoria-codex-parcial
