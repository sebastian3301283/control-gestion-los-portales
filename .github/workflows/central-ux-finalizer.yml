name: Central UX finalizer

on:
  push:
    branches:
      - auditoria-codex-parcial

permissions:
  contents: write

jobs:
  apply:
    name: Apply and verify Central UX
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Apply patch
        run: python scripts/central_ux_patch.py

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: node --test tests/*.test.mjs

      - name: Check TypeScript
        run: npm run check

      - name: Build production application
        run: npm run build

      - name: Commit verified implementation
        run: |
          rm .github/workflows/central-ux-finalizer.yml scripts/central_ux_patch.py
          git config user.name "Sebastian Aguilat"
          git config user.email "116051904+sebastian3301283@users.noreply.github.com"
          git add -A
          git commit -m "feat: refine Central editing and guideline flow"
          git push origin HEAD:auditoria-codex-parcial
