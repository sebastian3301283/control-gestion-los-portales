name: Apply planning performance patch

on:
  push:
    branches:
      - auditoria-codex-parcial
    paths:
      - scripts/apply-planning-performance.mjs
      - .github/workflows/apply-planning-performance.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auditoria-codex-parcial
      - name: Apply scoped load patch
        run: node scripts/apply-planning-performance.mjs
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- src; then
            echo "No production changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "perf: optimize planning workspace loads"
          git push origin HEAD:auditoria-codex-parcial
