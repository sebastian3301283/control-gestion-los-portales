name: Apply Central spreadsheet grid

on:
  push:
    branches:
      - feat/central-spreadsheet-grid
    paths:
      - scripts/apply-central-spreadsheet-grid.py
      - .github/workflows/apply-central-spreadsheet-grid.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/central-spreadsheet-grid
          fetch-depth: 0
      - run: python scripts/apply-central-spreadsheet-grid.py
      - run: git diff --check
      - run: node --test tests/central-excel-actions.test.mjs
      - name: Commit spreadsheet grid
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CentralExcelWorkspace.tsx src/matrix-workspace-v11.css
          git commit -m "feat: edit Central directly in spreadsheet grid"
          git push origin HEAD:feat/central-spreadsheet-grid
