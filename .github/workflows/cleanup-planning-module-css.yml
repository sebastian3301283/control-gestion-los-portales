name: Cleanup planning module CSS

on:
  push:
    branches:
      - auditoria-codex-parcial
    paths:
      - scripts/cleanup-planning-module-css.mjs
      - .github/workflows/cleanup-planning-module-css.yml

permissions:
  contents: write

jobs:
  cleanup-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auditoria-codex-parcial
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove lazy responsive dependency
        run: node scripts/cleanup-planning-module-css.mjs
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/planning-guidelines.css
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep planning card responsive css eager"
          git push origin HEAD:auditoria-codex-parcial
