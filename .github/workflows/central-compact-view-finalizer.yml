name: Central compact view finalizer

on:
  push:
    branches:
      - auditoria-codex-parcial
    paths:
      - scripts/.central_compact_view_trigger

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: auditoria-codex-parcial
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Central compact view patch
        run: python scripts/central_compact_view_patch.py

      - name: Run regression tests
        run: node --test tests/*.test.mjs

      - name: Check TypeScript
        run: npm run check

      - name: Build production application
        run: npm run build

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CentralExcelWorkspace.tsx src/MatrixWorkspaceV11.tsx src/central-excel-workspace.css tests/central-compact-view.test.mjs tests/central-ui-guideline-flow.test.mjs tests/central-guideline-inline-create.test.mjs tests/central-fullscreen-zoom-lock-release.test.mjs
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
          else
            git commit -m "feat: compact Central matrix view"
            git push origin HEAD:auditoria-codex-parcial
          fi
