name: Validate application

on:
  push:
    branches:
      - main
      - auditoria-codex-parcial
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply approved Central patch
        if: github.event_name == 'push' && github.ref == 'refs/heads/auditoria-codex-parcial'
        run: |
          if ! grep -q 'function startNewRowForGuideline' src/CentralExcelWorkspace.tsx; then
            python scripts/central_guideline_editor_patch.py
          fi
          if ! git diff --quiet -- src/CentralExcelWorkspace.tsx src/central-excel-workspace.css; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src/CentralExcelWorkspace.tsx src/central-excel-workspace.css
            git commit -m 'feat: scope Central actions to guidelines'
            git push origin HEAD:auditoria-codex-parcial
          fi

      - name: Run regression tests
        run: node --test tests/*.test.mjs

      - name: Check TypeScript
        run: npm run check

      - name: Build production application
        run: npm run build
