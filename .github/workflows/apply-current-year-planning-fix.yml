name: Apply current year planning fix

on:
  push:
    branches:
      - auditoria-codex-parcial
    paths:
      - scripts/apply-current-year-planning-fix.mjs
      - .github/workflows/apply-current-year-planning-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: auditoria-codex-parcial
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/apply-current-year-planning-fix.mjs
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Dashboard.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: use current year in direct planning"
          git push origin HEAD:auditoria-codex-parcial
