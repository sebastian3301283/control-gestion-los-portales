name: Central visual patch runner

on:
  push:
    branches: [auditoria-codex-parcial]
    paths:
      - .github/workflows/central-visual-runner.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: auditoria-codex-parcial
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Extract and apply patch
        run: |
          python3 -c "from pathlib import Path; w=Path('.github/workflows/central-visual-finalizer.yml').read_text(); s=w.split(\"          python3 <<'PY'\\n\",1)[1].split(\"\\n          PY\\n\",1)[0]; Path('/tmp/central_patch.py').write_text('\\n'.join(line[10:] if line.startswith('          ') else line for line in s.splitlines()))"
          python3 /tmp/central_patch.py
      - name: Install dependencies
        run: npm ci
      - name: Run regression tests
        run: node --test tests/*.test.mjs
      - name: Check TypeScript
        run: npm run check
      - name: Build production application
        run: npm run build
      - name: Commit verified implementation
        run: |
          git config user.name "Sebastian Aguilat"
          git config user.email "116051904+sebastian3301283@users.noreply.github.com"
          git add src/Dashboard.tsx src/PlanningGuidelines.tsx src/CentralExcelWorkspace.tsx src/central-excel-workspace.css tests/central-ui-guideline-flow.test.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: polish Central planning and matrix UX"
          git push origin HEAD:auditoria-codex-parcial
