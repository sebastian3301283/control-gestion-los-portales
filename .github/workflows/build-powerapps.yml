name: Build Control Gestion Power Apps V1

on:
  push:
    branches:
      - powerapps-control-gestion-v1
    paths:
      - 'powerapps/**'
      - '.github/workflows/build-powerapps.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Power Platform CLI
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          "$HOME/.dotnet/tools/pac" --version

      - name: Restore generator and base msapp
        run: |
          echo "$(cat powerapps/generator_bundle.b64)" | base64 -d > /tmp/generator_bundle.tar.gz
          tar -xzf /tmp/generator_bundle.tar.gz -C .
          echo "$(cat powerapps/base_msapp.b64)" | base64 -d > powerapps/base.msapp
          file powerapps/base.msapp
          unzip -t powerapps/base.msapp

      - name: Run generator tests
        run: python -m unittest discover -s powerapps/tests -v

      - name: Unpack base Canvas App
        run: |
          rm -rf powerapps/unpacked
          pac canvas unpack --msapp powerapps/base.msapp --sources powerapps/unpacked --overwrite --layout SourceCode

      - name: Generate Control de Gestion sources
        run: |
          python powerapps/build_powerapps.py powerapps/unpacked
          ls -la powerapps/unpacked/Src
          grep -R "ModernDatePicker@1.0.0" powerapps/unpacked/Src
          grep -R "dd/mm/yyyy" powerapps/unpacked/Src

      - name: Pack Canvas App with official CLI
        run: |
          mkdir -p dist
          pac canvas pack --sources powerapps/unpacked --msapp dist/ControlGestion_PowerApps_V1.msapp --overwrite --layout SourceCode
          file dist/ControlGestion_PowerApps_V1.msapp
          unzip -t dist/ControlGestion_PowerApps_V1.msapp

      - name: Verify round-trip unpack
        run: |
          rm -rf powerapps/roundtrip
          pac canvas unpack --msapp dist/ControlGestion_PowerApps_V1.msapp --sources powerapps/roundtrip --overwrite --layout SourceCode
          test -f powerapps/roundtrip/Src/scrInicio.pa.yaml
          test -f powerapps/roundtrip/Src/scrMatriz.pa.yaml
          grep -R "ModernDatePicker@1.0.0" powerapps/roundtrip/Src
          grep -R "Control de Gestión" powerapps/roundtrip/Src

      - name: Upload msapp artifact
        uses: actions/upload-artifact@v4
        with:
          name: ControlGestion-PowerApps-V1
          path: dist/ControlGestion_PowerApps_V1.msapp
          if-no-files-found: error
