name: Build Control Gestion Power Apps V4

on:
  push:
    branches:
      - powerapps-control-gestion-v4
    paths:
      - 'powerapps/**'
      - '.github/workflows/build-powerapps.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Install Power Platform CLI
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          "$HOME/.dotnet/tools/pac" help >/dev/null

      - name: Restore blank base msapp
        run: |
          cat powerapps/base_parts/*.txt > /tmp/base_msapp.b64
          test "$(wc -c < /tmp/base_msapp.b64)" -eq 22384
          base64 -d /tmp/base_msapp.b64 > powerapps/base.msapp
          file powerapps/base.msapp
          unzip -t powerapps/base.msapp

      - name: Restore V3 visual builder
        run: |
          cat powerapps/v3_builder_parts/*.txt > /tmp/v3_builder.b64
          test "$(wc -c < /tmp/v3_builder.b64)" -eq 13684
          base64 -d /tmp/v3_builder.b64 | gzip -d > powerapps/build_powerapps_v3.py
          python -m py_compile powerapps/build_powerapps_v3.py

      - name: Unpack base Canvas App
        run: |
          rm -rf powerapps/unpacked
          pac canvas unpack --msapp powerapps/base.msapp --sources powerapps/unpacked --overwrite --layout SourceCode

      - name: Generate V3 visual-parity sources
        run: |
          python powerapps/build_powerapps_v3.py powerapps/unpacked

      - name: Prove duplicate-name regression exists before fix
        continue-on-error: true
        env:
          POWERAPPS_SRC_DIR: powerapps/unpacked/Src
        run: python -m unittest -v powerapps/test_powerapps_v4.py

      - name: Prefix all screen controls to make names app-wide unique
        run: python powerapps/prefix_powerapps_controls.py powerapps/unpacked/Src

      - name: Run V4 regression tests
        env:
          POWERAPPS_SRC_DIR: powerapps/unpacked/Src
        run: |
          python -m unittest -v powerapps/test_powerapps_v4.py
          grep -R "ini_cntSidebar" powerapps/unpacked/Src/scrInicio.pa.yaml
          grep -R "Width: =230" powerapps/unpacked/Src/scrInicio.pa.yaml
          grep -R "ModernDatePicker@1.0.1" powerapps/unpacked/Src/scrMatriz.pa.yaml
          grep -R 'Format: ="dd/mm/yyyy"' powerapps/unpacked/Src/scrMatriz.pa.yaml
          ! grep -R "CustomFormat:" powerapps/unpacked/Src

      - name: Pack Canvas App with official CLI
        run: |
          mkdir -p dist
          pac canvas pack --sources powerapps/unpacked --msapp dist/ControlGestion_PowerApps_V4.msapp --overwrite --layout SourceCode
          file dist/ControlGestion_PowerApps_V4.msapp
          unzip -t dist/ControlGestion_PowerApps_V4.msapp

      - name: Verify round-trip unpack and regressions
        run: |
          rm -rf powerapps/roundtrip
          pac canvas unpack --msapp dist/ControlGestion_PowerApps_V4.msapp --sources powerapps/roundtrip --overwrite --layout SourceCode
          test -f powerapps/roundtrip/Src/scrInicio.pa.yaml
          test -f powerapps/roundtrip/Src/scrMatriz.pa.yaml
          grep -R "ini_cntSidebar" powerapps/roundtrip/Src/scrInicio.pa.yaml
          grep -R "Control de Gestión" powerapps/roundtrip/Src
          ! grep -R "CustomFormat:" powerapps/roundtrip/Src
          POWERAPPS_SRC_DIR=powerapps/roundtrip/Src python -m unittest -v powerapps/test_powerapps_v4.py

      - name: Upload msapp artifact
        uses: actions/upload-artifact@v4
        with:
          name: ControlGestion-PowerApps-V4
          path: dist/ControlGestion_PowerApps_V4.msapp
          if-no-files-found: error
