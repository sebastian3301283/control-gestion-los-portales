name: Build Control Gestion Power Apps V2

on:
  push:
    branches:
      - powerapps-control-gestion-v1
    paths:
      - 'powerapps/**'
      - '.github/workflows/build-powerapps.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Power Platform CLI
        run: |
          dotnet tool install --global Microsoft.PowerApps.CLI.Tool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          "$HOME/.dotnet/tools/pac" help >/dev/null

      - name: Restore generator and base msapp
        run: |
          base64 -d powerapps/generator_bundle.b64 > /tmp/generator_bundle.tar.gz
          tar -xzf /tmp/generator_bundle.tar.gz -C .
          cat powerapps/base_parts/*.txt > /tmp/base_msapp.b64
          test "$(wc -c < /tmp/base_msapp.b64)" -eq 22384
          base64 -d /tmp/base_msapp.b64 > powerapps/base.msapp
          file powerapps/base.msapp
          unzip -t powerapps/base.msapp

      - name: Run generator tests
        run: python -m unittest discover -s powerapps/tests -v

      - name: Unpack base Canvas App
        run: |
          rm -rf powerapps/unpacked
          pac canvas unpack --msapp powerapps/base.msapp --sources powerapps/unpacked --overwrite --layout SourceCode

      - name: Generate and validate Control de Gestion sources
        run: |
          python powerapps/build_powerapps.py powerapps/unpacked
          ls -la powerapps/unpacked/Src
          grep -R "ModernDatePicker@1.0.1" powerapps/unpacked/Src
          grep -R "ModernTextInput@1.1.1" powerapps/unpacked/Src
          grep -R "ModernDropdown@1.0.2" powerapps/unpacked/Src
          grep -R 'Format: ="dd/mm/yyyy"' powerapps/unpacked/Src
          ! grep -R "CustomFormat:" powerapps/unpacked/Src
          ! grep -R "Value: =LookUp" powerapps/unpacked/Src

      - name: Pack Canvas App with official CLI
        run: |
          mkdir -p dist
          pac canvas pack --sources powerapps/unpacked --msapp dist/ControlGestion_PowerApps_V2.msapp --overwrite --layout SourceCode
          file dist/ControlGestion_PowerApps_V2.msapp
          unzip -t dist/ControlGestion_PowerApps_V2.msapp

      - name: Verify round-trip unpack
        run: |
          rm -rf powerapps/roundtrip
          pac canvas unpack --msapp dist/ControlGestion_PowerApps_V2.msapp --sources powerapps/roundtrip --overwrite --layout SourceCode
          test -f powerapps/roundtrip/Src/scrInicio.pa.yaml
          test -f powerapps/roundtrip/Src/scrMatriz.pa.yaml
          grep -R "ModernDatePicker@1.0.1" powerapps/roundtrip/Src
          grep -R 'Format: ="dd/mm/yyyy"' powerapps/roundtrip/Src
          grep -R "Control de Gestión" powerapps/roundtrip/Src
          ! grep -R "CustomFormat:" powerapps/roundtrip/Src
          ! grep -R "Value: =LookUp" powerapps/roundtrip/Src

      - name: Upload msapp artifact
        uses: actions/upload-artifact@v4
        with:
          name: ControlGestion-PowerApps-V2
          path: dist/ControlGestion_PowerApps_V2.msapp
          if-no-files-found: error
