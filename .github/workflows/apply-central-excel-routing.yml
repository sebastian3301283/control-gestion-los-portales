name: Apply Central Excel routing

on:
  push:
    branches:
      - fix/central-excel-actions-multi-responsible
    paths:
      - scripts/apply-central-excel-routing.py
      - .github/workflows/apply-central-excel-routing.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/central-excel-actions-multi-responsible
          fetch-depth: 0
      - run: python scripts/apply-central-excel-routing.py
      - run: git diff --check
      - run: node --test tests/central-excel-actions.test.mjs
      - name: Commit routing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MatrixWorkspaceV11.tsx src/CentralExcelWorkspace.tsx
          git commit -m "feat: route Central through Excel action workspace"
          git push origin HEAD:fix/central-excel-actions-multi-responsible
