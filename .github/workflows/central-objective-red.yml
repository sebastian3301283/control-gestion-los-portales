name: Focused Central regression

on:
  push:
    branches:
      - fix/central-objective-fields-realtime
    paths:
      - tests/central-objective-fields-realtime.test.mjs
      - scripts/apply-central-objective-fields-realtime.py
      - .github/workflows/central-objective-red.yml

permissions:
  contents: write

jobs:
  focused-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/central-objective-fields-realtime
          fetch-depth: 0
      - name: Apply root-cause fix
        run: python scripts/apply-central-objective-fields-realtime.py
      - name: Verify focused regression
        run: node --test tests/central-objective-fields-realtime.test.mjs
      - name: Verify patch formatting
        run: git diff --check
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MatrixWorkspaceV10.tsx src/MatrixWorkspaceV11.tsx src/MatrixRealtimeLayer.tsx
          git commit -m "fix: show objective detail and refresh collaborative rows"
          git push origin HEAD:fix/central-objective-fields-realtime
