name: Apply noncentral risk column order

on:
  push:
    branches:
      - auditoria-codex-parcial

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: auditoria-codex-parcial
          fetch-depth: 0

      - name: Reorder noncentral columns
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/UnitExcelWorkspace.tsx')
          source = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '<thead><tr><th>Acción</th><th>Responsable</th><th>Prioridad</th><th>Hitos / Fechas</th><th>Entregable</th><th>Riesgos de no ejecutar</th><th>Restricciones</th><th>Soporte</th><th>Comité</th></tr></thead>',
                  '<thead><tr><th>Acción</th><th>Responsable</th><th>Prioridad</th><th>Hitos / Fechas</th><th>Entregable</th><th>Soporte</th><th>Comité</th><th>Riesgos de no ejecutar</th><th>Restricciones</th></tr></thead>',
              ),
              (
                  '''      <td className="matrix-central-sheet-cell"><textarea rows={1} value={rowDraft.deliverables || ''} onChange={event => updateDraft('deliverables', event.target.value)} placeholder="Entregable" aria-label="Entregable"/></td>\n      <td className="matrix-central-sheet-cell"><textarea rows={1} value={rowDraft.risks || ''} onChange={event => updateDraft('risks', event.target.value)} placeholder="Riesgos de no ejecutar" aria-label="Riesgos de no ejecutar"/></td>\n      <td className="matrix-central-sheet-cell"><textarea rows={1} value={rowDraft.restrictions || ''} onChange={event => updateDraft('restrictions', event.target.value)} placeholder="Restricciones" aria-label="Restricciones"/></td>\n      <td className="matrix-central-sheet-cell"><textarea rows={1} value={rowDraft.support || ''} onChange={event => updateDraft('support', event.target.value)} placeholder="Soporte" aria-label="Soporte"/></td>\n      <td className="matrix-central-sheet-cell"><textarea rows={1} value={rowDraft.committee || ''} onChange={event => updateDraft('committee', event.target.value)} placeholder="Comité" aria-label="Comité"/></td>''',
                  '''      <td className="matrix-central-sheet-cell"><textarea rows={1} value={rowDraft.deliverables || ''} onChange={event => updateDraft('deliverables', event.target.value)} placeholder="Entregable" aria-label="Entregable"/></td>\n      <td className="matrix-central-sheet-cell"><textarea rows={1} value={rowDraft.support || ''} onChange={event => updateDraft('support', event.target.value)} placeholder="Soporte" aria-label="Soporte"/></td>\n      <td className="matrix-central-sheet-cell"><textarea rows={1} value={rowDraft.committee || ''} onChange={event => updateDraft('committee', event.target.value)} placeholder="Comité" aria-label="Comité"/></td>\n      <td className="matrix-central-sheet-cell"><textarea rows={1} value={rowDraft.risks || ''} onChange={event => updateDraft('risks', event.target.value)} placeholder="Riesgos de no ejecutar" aria-label="Riesgos de no ejecutar"/></td>\n      <td className="matrix-central-sheet-cell"><textarea rows={1} value={rowDraft.restrictions || ''} onChange={event => updateDraft('restrictions', event.target.value)} placeholder="Restricciones" aria-label="Restricciones"/></td>''',
              ),
              (
                  "<td>{row.milestones || '—'}</td><td>{row.deliverables || '—'}</td><td>{row.risks || '—'}</td><td>{row.restrictions || '—'}</td><td>{row.support || '—'}</td><td>{row.committee || '—'}</td>",
                  "<td>{row.milestones || '—'}</td><td>{row.deliverables || '—'}</td><td>{row.support || '—'}</td><td>{row.committee || '—'}</td><td>{row.risks || '—'}</td><td>{row.restrictions || '—'}</td>",
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]}')
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          Path('.github/workflows/apply-noncentral-risk-order.yml').unlink()
          PY

      - name: Commit exact change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/UnitExcelWorkspace.tsx .github/workflows/apply-noncentral-risk-order.yml
          git commit -m "fix: move noncentral risks and restrictions to end"
          git push origin HEAD:auditoria-codex-parcial
